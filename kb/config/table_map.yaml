fibo-fnd:Portfolio:              {table: mart_wealth.portfolio, hint: "one row per client portfolio"}
kb:AssetsUnderManagement:        {table: mart_wealth.portfolio, hint: "aum"}
kb:ModelPortfolioAllocation:     {table: mart_wealth.portfolio, hint: "risk_profile, equity_pct, bond_pct, cash_pct"}
fibo-fbc:EquityInstrument:       {table: mart_wealth.portfolio, hint: "equity_pct"}
fibo-sec:Bond:                   {table: mart_wealth.portfolio, hint: "bond_pct"}
