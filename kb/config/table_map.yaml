fibo-loan:MotorVehicleLoan:      {table: mart_credit.loan, hint: "product = 'Car Loan'"}
fibo-loan:UnsecuredConsumerLoan: {table: mart_credit.loan, hint: "product = 'Personal Loan'"}
fibo-loan:CreditCard:            {table: mart_credit.loan, hint: "product = 'Credit Card'"}
kb:TermLoan:                     {table: mart_credit.loan, hint: "product = 'Term Loan'"}
kb:WorkingCapitalFacility:       {table: mart_credit.loan, hint: "product = 'Working Capital'"}
kb:Arrears:                      {table: mart_credit.loan, hint: "status IN ('ARREARS_30', 'ARREARS_90')"}
fibo-fnd:InterestRate:           {table: mart_credit.loan, hint: "interest_rate (percent p.a.)"}
fibo-fbc:Collateral:             {table: mart_credit.collateral, hint: "one row per collateral item"}
