                               advance ratio, lending ratio, standard advance]
  fibo-loan:Mortgage: [home loan, housing loan, mortgage loan, mortgages]
  fibo-loan:MotorVehicleLoan: [car loan, auto loan, vehicle loan]
  fibo-loan:UnsecuredConsumerLoan: [personal loan, unsecured personal loan]
  fibo-loan:CreditCard: [credit cards]
  fibo-fbc:Collateral: [collateral class, security, pledged assets, collateral pledged]
  fibo-loan:CollateralValuation: [valuation, collateral valuation, independent valuation, property valuation]
  fibo-fnd:InterestRate: [interest rate, indicative rate, rate p.a., pricing tier]
  fibo-fbc:Fee: [fees, charges, fees and charges, fee schedule]
  fibo-fnd:Portfolio: [portfolio, portfolios, mandate]
  fibo-sec:Bond: [bonds, investment-grade bonds, fixed income]
  fibo-fbc:EquityInstrument: [equities, equity, stocks, shares, blue-chip equities, blue chip shares]
  fibo-sec:PooledFund: [diversified funds, funds, unit trusts]
  fibo-fbc:PackagedFinancialProduct: [structured notes, structured products, structured note]
  fibo-fbc:InsurancePolicy: [insurance wrapper, insurance policy]
  fibo-fbc:CreditRating: [credit rating, rating methodology, internal rating]
  fibo-fbc:RevolvingLineOfCredit: [revolving credit, revolving facility]
  fibo-loan:SecuredLoan: [secured lending, secured loan]
  fibo-fbc:Borrower: [borrower, borrowers, obligor]
  fibo-fnd:Regulation: [local regulation, regulatory requirements, regulations]
