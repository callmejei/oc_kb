# Local prototype. Every endpoint is loopback; config validation rejects anything else.
# ${VAR} values come from the environment or .env.local (generated by `make up`, gitignored).
env: local

paths:
  data_dir: data                       # synthetic corpus, marts, raw store (relative to repo root)
  infra_dir: .infra                    # binaries, service data, logs

network:
  allowed_hosts: [127.0.0.1, localhost]

services:
  postgres:
    host: 127.0.0.1
    port: 5433
    database: kb
    admin_user: kb_admin
    admin_password: ${KB_PG_ADMIN_PASSWORD}
  elasticsearch:
    url: http://127.0.0.1:9250
    user: elastic
    password: ${KB_ES_PASSWORD}
    heap: 2g
  ollama:
    url: http://127.0.0.1:11435
  phoenix:
    url: http://127.0.0.1:6006
  dagster:
    url: http://127.0.0.1:3070

gateway:
  host: 127.0.0.1
  port: 8000
  auth: local_jwt               # Phase 3: login -> signed token (D-028). dev header only for listed test clients
  trusted_clients: []           # clients allowed to use the X-KB-User dev header (tests pass "testclient")
  token_ttl_minutes: 60
  jwt_secret: "${KB_JWT_SECRET}"
  local_users: .infra/secrets/local_users.hash.json   # generated by kbinfra; operator list in local_users.txt

retrieval:
  bm25_k: 20                    # candidates from each retriever (both pre-filtered)
  knn_k: 20
  fused_k: 20                   # after reciprocal rank fusion
  rerank_k: 6                   # chunks given to the LLM
  min_rerank_score: 0.05        # cross-encoder probability (sigmoid applied); below it a chunk is not context
  max_context_chars: 9000

processing:
  registry_dsn: "postgresql://kb_pipe:${KB_PG_PIPELINE_PASSWORD}@127.0.0.1:5433/kb"   # pipeline role, never kb_api
  docling_artifacts: .infra/models/docling
  ocr_backend: torch            # RapidOCR on PyTorch, CPU; models from docling_artifacts (offline)
  chunk_max_tokens: 400         # HybridChunker budget, bge-small tokenizer (max 512)
  processed_url: file://data/processed
  pii:                          # default gate; a source revision's pii_policy overrides keys
    spacy_model: en_core_web_lg
    min_score: 0.6
    max_entities: 5
    entities: [EMAIL_ADDRESS, PHONE_NUMBER, CREDIT_CARD, IBAN_CODE, US_SSN, UK_NHS, PERSON]
  # retention classes live in the registry (kb.retention_class, migration 004)
  max_concurrent_ingestion_runs: 4

ports:
  document_source:   {adapter: local.LocalFolderSource, root: data/sharepoint, page_size: 25}
  upload_source:     {adapter: local.UploadSource, root: data/raw/uploads}
  malware_scanner:   {adapter: local.AllowListScanner}
  raw_store:         {adapter: local.FsspecRawStore, url: file://data/raw}
  registry:          {adapter: local.PostgresRegistry, dsn: "postgresql://kb_api:${KB_PG_API_PASSWORD}@127.0.0.1:5433/kb"}
  chunk_index:       {adapter: local.ElasticsearchChunkIndex, url: http://127.0.0.1:9250, index_alias: kb-chunks, dims: 384, user: elastic, password: "${KB_ES_PASSWORD}"}
  embedder:          {adapter: local.SentenceTransformerEmbedder, model: BAAI/bge-small-en-v1.5, revision: 5c38ec7c405ec4b44b94cc5a9bb96e735b38267a, path: .infra/models/hf/BAAI--bge-small-en-v1.5, dims: 384, device: cpu}
  reranker:          {adapter: local.CrossEncoderReranker, model: BAAI/bge-reranker-base, revision: 2cfc18c9415c912f9d8155881c133215df768a70, path: .infra/models/hf/BAAI--bge-reranker-base, device: cpu}
  llm:               {adapter: local.OpenAICompatibleLLM, base_url: http://127.0.0.1:11435/v1, model: qwen3:8b, max_tokens: 700, extra_body: {reasoning_effort: none}}
  sql_engine:        {adapter: local.DuckDbPolicySqlEngine, path: data/marts/marts.duckdb, policies: config/policies.yaml}
  identity_provider: {adapter: local.YamlIdentityProvider, path: config/users.yaml}
  graph_store:       {adapter: local.OxigraphGraphStore, path: data/graph}
  tracer:            {adapter: local.PhoenixTracer, endpoint: http://127.0.0.1:6006}
