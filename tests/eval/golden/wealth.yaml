# Golden set for the wealth BU (Phase 7: one file per BU; asked as wlth.user1).
# kind: documents | expansion (paraphrase; scored with and without graph expansion) | data | both | abstain.
# facts: any of these strings in the answer (case-insensitive) counts as correct; every fact appears in an
#   expected document and in the reference (tests/eval/test_golden_consistency.py).
# reference: the ground-truth answer used by RAGAS context recall / answer correctness.
# data / both: truth_sql computes the expected figure from the raw marts, scoped like the user's row filter.
# abstain: nothing in the corpus answers it; correct = the fixed "not covered" / "could not find" reply.
bu: wealth
user: wlth.user1
questions:
- id: w1
  kind: documents
  q: What is the standard advance ratio for blue-chip equities?
  facts:
  - 60%
  expected_docs:
  - wlth-lombard-policy
  reference: The standard advance ratio for blue-chip equities is 60%.
- id: w2
  kind: documents
  q: What is the concentrated holding advance for investment-grade bonds?
  facts:
  - 65%
  expected_docs:
  - wlth-lombard-policy
  reference: The concentrated holding advance for investment-grade bonds is 65%.
- id: w3
  kind: documents
  q: What is the standard advance for structured notes?
  facts:
  - 40%
  expected_docs:
  - wlth-lombard-policy
  reference: The standard advance for structured notes is 40%.
