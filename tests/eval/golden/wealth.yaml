- id: e3
  kind: expansion
  q: What advance can be given against blue chip shares?
  facts:
  - 60%
  expected_docs:
  - wlth-lombard-policy
  reference: The standard advance ratio for blue-chip equities is 60%.
- id: e5
  kind: expansion
  q: What share of a Balanced model portfolio goes into stocks?
  facts:
  - 45%
  expected_docs:
  - wlth-model-portfolios
  - wlth-mandate-guide
  - wlth-ic-briefing
  reference: The Balanced model portfolio allocates 45% to equities.
- id: d6
  kind: data
  q: How many portfolios have a Growth risk profile?
  truth_sql: SELECT count(*) FROM mart_wealth.portfolio WHERE bu='wealth' AND risk_profile='Growth'
- id: d7
  kind: data
  q: What is the total AUM of discretionary portfolios?
  truth_sql: SELECT round(sum(aum), 2) FROM mart_wealth.portfolio WHERE bu='wealth' AND mandate='Discretionary'
- id: d8
  kind: data
  q: How many customers are there?
  truth_sql: SELECT count(*) FROM mart_cust.customer WHERE bu='wealth'
- id: b3
  kind: both
  q: What equity allocation does the Balanced model portfolio have, and how many portfolios have a Balanced risk profile?
  truth_sql: SELECT count(*) FROM mart_wealth.portfolio WHERE bu='wealth' AND risk_profile='Balanced'
  doc_fact: 45%
- id: wa1
  kind: abstain
  q: What is the minimum subscription for the fine art investment fund?
- id: m5
  kind: data
  q: What is the total AUM?
  metric: aum
  truth_sql: SELECT round(sum(aum), 2) FROM mart_wealth.portfolio WHERE bu='wealth'
