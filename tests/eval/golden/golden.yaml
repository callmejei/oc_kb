# Golden questions per BU (synthetic world). Facts come from synthetic/content.py tables and template
# paragraphs; tests/eval/test_golden_consistency.py proves each fact appears in an expected document.
# expected_docs: document keys from synthetic/world.py; any of them counts as a retrieval/citation hit.
# facts: any of these strings in the answer (case-insensitive) counts as correct.

retail:
  user: ret.user1
  questions:
    - id: r1
      q: What is the maximum LTV for a first facility on an owner-occupied residential property?
      facts: ["75%"]
      expected_docs: [ret-home-loan-policy, ret-home-loan-sheet, ret-valuation-guide, ret-car-loan-sheet]
    - id: r2
      q: What is the LTV limit for a third or subsequent facility on an investment residential property?
      facts: ["40%"]
      expected_docs: [ret-home-loan-policy, ret-home-loan-sheet, ret-valuation-guide, ret-car-loan-sheet]
    - id: r3
      q: How much is the late payment fee?
      facts: ["75.00"]
      expected_docs: [ret-fees]
    - id: r4
      q: What does document retrieval cost per copy?
      facts: ["20.00"]
      expected_docs: [ret-fees]
    - id: r5
      q: What is the fee for a telegraphic transfer?
      facts: ["25.00"]
      expected_docs: [ret-fees]
    - id: r6
      q: For how long can a policy exception be granted at most?
      facts: ["twelve months", "12 months"]
      expected_docs: [ret-home-loan-policy, ret-home-loan-sheet, ret-personal-loan-proc, ret-credit-card-sheet,
                      ret-collections-proc, ret-valuation-guide, ret-fees, ret-branch-onboarding, ret-q3-briefing,
                      ret-car-loan-sheet]
