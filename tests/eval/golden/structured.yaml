# Structured golden questions (Phase 4). truth_sql computes the expected figure from the raw marts,
# scoped exactly like the asking user's row filter. Combined questions also expect a document fact.
- {id: d1, user: ret.user1, route: data, q: "How many loans are 90 days in arrears?",
   truth_sql: "SELECT count(*) FROM mart_credit.loan WHERE bu='retail' AND status='ARREARS_90'"}
- {id: d2, user: ret.user1, route: data, q: "How many home loans are there?",
   truth_sql: "SELECT count(*) FROM mart_credit.loan WHERE bu='retail' AND product='Home Loan'"}
- {id: d3, user: ret.user1, route: data, q: "What is the total outstanding balance of car loans?",
   truth_sql: "SELECT round(sum(outstanding), 2) FROM mart_credit.loan WHERE bu='retail' AND product='Car Loan'"}
- {id: d4, user: corp.user1, route: data, q: "How many loans are 30 days in arrears?",
   truth_sql: "SELECT count(*) FROM mart_credit.loan WHERE bu='corporate' AND status='ARREARS_30'"}
- {id: d5, user: corp.user1, route: data, q: "What is the average interest rate of term loans, rounded to 2 decimals?",
   truth_sql: "SELECT round(avg(interest_rate), 2) FROM mart_credit.loan WHERE bu='corporate' AND product='Term Loan'"}
