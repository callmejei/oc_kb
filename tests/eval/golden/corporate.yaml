- id: d4
  kind: data
  q: How many loans are 30 days in arrears?
  truth_sql: SELECT count(*) FROM mart_credit.loan WHERE bu='corporate' AND status='ARREARS_30'
- id: d5
  kind: data
  q: What is the average interest rate of term loans, rounded to 2 decimals?
  truth_sql: SELECT round(avg(interest_rate), 2) FROM mart_credit.loan WHERE bu='corporate' AND product='Term Loan'
- id: d10
  kind: data
  q: What is the average loan-to-value of collateral, rounded to 2 decimals?
  truth_sql: SELECT round(avg(ltv_pct), 2) FROM mart_credit.collateral WHERE bu='corporate'
- id: b2
  kind: both
  q: What is the maximum first-facility LTV for commercial office property in the commercial property lending policy,
    and how many collateral records exceed an LTV of 45%?
  truth_sql: SELECT count(*) FROM mart_credit.collateral WHERE bu='corporate' AND ltv_pct > 45
  doc_fact: 45%
